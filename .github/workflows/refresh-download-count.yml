name: Refresh download count

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  release:
    types: [published, edited]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update releases/latest.json downloadCount (all DMGs)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          meta=releases/latest.json
          # Every published DMG, all versions: a new release must not reset the count.
          count=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq '[.[] | select(.draft | not) | .assets[] | select(.name | endswith(".dmg")) | .download_count] | add // 0' \
            | awk '{ total += $1 } END { print total + 0 }')
          if [ -z "${count}" ]; then
            echo "No DMG download counts found"
            exit 1
          fi
          python3 - "${count}" <<'PY'
          import json, pathlib, sys
          count = int(sys.argv[1])
          path = pathlib.Path("releases/latest.json")
          data = json.loads(path.read_text())
          if data.get("downloadCount") == count:
            print(f"downloadCount already {count}")
            sys.exit(0)
          data["downloadCount"] = count
          path.write_text(json.dumps(data, indent=2) + "\n")
          print(f"updated downloadCount -> {count}")
          PY

      - name: Commit if changed
        run: |
          if git diff --quiet -- releases/latest.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/latest.json
          git commit -m "Refresh DMG downloadCount from GitHub Releases"
          git push
